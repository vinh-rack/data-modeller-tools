# Step gate flows (ARCHITECTURE.md section 3). Each flow is an ordered list of gated stages.
# Every stage ends at Approve, Disapprove or Suggest changes. Approving the last stage unlocks compile_report and write_artifact,
# so the writing step (review artifacts, build compile, lineage compile) comes after the last gate and is not a stage here.
# A session keeps the stage list it started with, so editing this file does not change sessions already in progress.

flows:
  # REQUIREMENTS FR-R6, stages 1 to 6. Stage 7 (artifacts) runs after the last gate.
  review: [scope, intake, structural_review, semantic_review, hard_rule_checklist, findings]
  # ARCHITECTURE section 4 and REQUIREMENTS D5: the original 14-step flow (2 Nov) as 11 stages, each gated.
  # A stage is a plain id or a mapping with id, label, og_step (the original flow's step numbers), major_gate (its three named gates)
  # and template (a YAML file in the config folder whose headings the stage output follows).
  build:
    - {id: scope, label: Scope}
    - {id: powerbi_intake, label: Power BI intake, og_step: "1"}
    - {id: requirements, label: Requirements, og_step: "2", template: requirements_doc.yaml}
    - {id: legacy_entities, label: Legacy entities, og_step: "3"}
    - {id: bronze_identification, label: Bronze identification, og_step: "4", major_gate: Bronze table list}
    - {id: data_extraction, label: Data extraction, og_step: "5.1"}
    - {id: reuse_check, label: Reuse check, og_step: "6, 7"}
    - {id: silver_staging, label: Silver Staging, og_step: "8"}
    - {id: silver_idm, label: Silver IDM, og_step: "9", major_gate: Silver schemas}
    - {id: gold, label: Gold, og_step: "11, 12", major_gate: Gold models}
    - {id: rules_pass, label: Rules pass}
  # FR-L1 to FR-L3. Compile runs after the last gate.
  lineage: [scope, bronze_dependencies, column_lineage, diagram]

# Largest stage output accepted by submit_stage, in UTF-8 bytes.
max_content_bytes: 1000000
